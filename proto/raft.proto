syntax = "proto3";

package raft;

service RaftService {
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
    rpc CommitEntries(CommitEntriesRequest) returns (CommitEntriesResponse);
}

message AppendEntriesRequest {}

message AppendEntriesResponse {}

message CommitEntriesRequest {}

message CommitEntriesResponse {}